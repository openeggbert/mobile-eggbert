plugins {
    id 'com.android.application'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "org.openeggbert.speedyblupi"
    compileSdkVersion 35
    // NDK r23 is the final supported NDK line for the API 16 baseline.
    // NDK r25 raises native code to API 19 and newer releases require API 21.
    ndkVersion = "23.1.7779620"

    defaultConfig {
        applicationId "org.openeggbert.speedyblupi"
        // SDL3's Android project supports API 16.  This keeps the APK usable
        // on Android 4.1–4.3 tablets while retaining the modern compile SDK.
        // Android 4.0 (API 14/15) is not supported by the bundled SDL3 code.
        minSdkVersion 16
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                // Pass Android platform and C++ STL config.
                arguments "-DANDROID_PLATFORM=android-16",
                          "-DANDROID_STL=c++_static",
                          // Disable sharp-runtime and CNA tests (they use gtest
                          // which is not needed in the APK build).
                          "-DCNA_BUILD_TESTS=OFF",
                          "-DSHARP_RUNTIME_BUILD_TESTS=OFF"
                // Old Android 4 tablets are almost always 32-bit ARM. Keep
                // arm64 too, so this single universal APK also works on newer
                // ARM devices.
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            } else {
                // key.properties not found – assembleRelease will fail with a clear message below
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            // Point to the game's root CMakeLists.txt (one level up from android/).
            path '../../CMakeLists.txt'
            version "4.1.2"
        }
    }

    // Package game assets into the APK as Android assets (read-only).
    //
    // Asset layout in the APK must match the paths the game uses at runtime.
    // The game loads e.g. "Content/backgrounds/decor000.png" and "worlds/world001.txt".
    // SDL_IOFromFile on Android first checks internal storage, then the APK AAssetManager.
    //
    // We set the asset source to the mobile-eggbert root so that the directory
    // structure is preserved:
    //   <mobile-eggbert>/Content/backgrounds/... -> Content/backgrounds/... in APK
    //   <mobile-eggbert>/worlds/...              -> worlds/... in APK
    //
    // Other files at that level (src/, cmake/, etc.) are excluded by AGP because
    // the asset merger only includes directories/files reachable from assets.srcDirs.
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            java.srcDirs = [
                // SDL3 Java glue (SDLActivity, SDLAudioManager, etc.)
                '../../cna/third_party/SDL/android-project/app/src/main/java',
                // Game-specific Java (just the minimal stub subclassing SDLActivity)
                'src/main/java'
            ]
            res.srcDirs = ['src/main/res']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    lint {
        abortOnError = false
    }
}

// AGP 8 build-type objects do not expose doFirst().  Attach the helpful
// missing-keystore error to the actual release task instead, so debug builds
// (used for local sideloading) remain usable without a private signing key.
if (!keystorePropertiesFile.exists()) {
    tasks.matching { it.name == 'assembleRelease' }.configureEach {
        doFirst {
            throw new GradleException(
                "\n\n" +
                "========================================================\n" +
                " ERROR: key.properties not found in android/ directory.\n" +
                " Cannot build a signed release APK.\n" +
                " See ANDROID.md for instructions on creating key.properties.\n" +
                "========================================================\n"
            )
        }
    }
}

dependencies {
    // No extra Java/Kotlin dependencies required – SDL provides the full activity.
}
